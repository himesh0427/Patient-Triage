# ── ServiceAccount (IRSA) ─────────────────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend-sa
  namespace: patient-triage
  annotations:
    # Replace with the actual ARN from `terraform output backend_pod_role_arn`
    eks.amazonaws.com/role-arn: "arn:aws:iam::ACCOUNT_ID:role/patient-triage-backend-pod-role"
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: patient-triage
---
# ── Deployment ────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: patient-triage
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: patient-triage
  annotations:
    # kustomize will update this during CD
    deployment.kubernetes.io/revision: "1"
spec:
  # NOTE: SQLite cannot handle concurrent writes from multiple replicas.
  # Keep replicas: 1 when DATABASE_URL points to SQLite.
  # Switch to replicas: 2+ after migrating to PostgreSQL (via DATABASE_URL).
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: backend

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0  # Zero-downtime rollout

  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: patient-triage
      annotations:
        # Force pod restart when ConfigMap changes
        checksum/config: "placeholder-updated-by-kustomize"
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8000"
    spec:
      serviceAccountName: backend-sa
      automountServiceAccountToken: true

      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: backend
          # kustomize will replace this image reference during CI/CD
          image: ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/patient-triage/backend:latest
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          envFrom:
            - configMapRef:
                name: backend-config

          env:
            - name: DATABASE_URL
              value: "sqlite:////data/triage.db"

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false  # SQLite writes to /data
            capabilities:
              drop: ["ALL"]

          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"

          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1

          startupProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 12  # 60s budget for model load

          volumeMounts:
            - name: sqlite-data
              mountPath: /data

      volumes:
        - name: sqlite-data
          persistentVolumeClaim:
            claimName: backend-sqlite-pvc

      terminationGracePeriodSeconds: 30

---
# ── PersistentVolumeClaim for SQLite ─────────────────────────────────────────
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backend-sqlite-pvc
  namespace: patient-triage
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: patient-triage
spec:
  accessModes:
    - ReadWriteOnce  # Single-writer (matches replicas: 1)
  storageClassName: gp2    # EBS gp2 — provisioned by aws-ebs-csi-driver
  resources:
    requests:
      storage: 5Gi
