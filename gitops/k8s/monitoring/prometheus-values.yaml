# kube-prometheus-stack Helm values for PatientTriage.ai
# Install via:
#   helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
#   helm repo update
#   helm upgrade --install kube-prometheus-stack prometheus-community/kube-prometheus-stack \
#     --namespace monitoring --create-namespace \
#     --values gitops/k8s/monitoring/prometheus-values.yaml

prometheus:
  enabled: true

  prometheusSpec:
    retention: 7d
    retentionSize: "10GiB"

    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp2
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi

    # Scrape all ServiceMonitors across namespaces
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    serviceMonitorNamespaceSelector: {}

    # Scrape all PodMonitors
    podMonitorSelectorNilUsesHelmValues: false
    podMonitorSelector: {}
    podMonitorNamespaceSelector: {}

    # Triage-specific alerting rules
    additionalPrometheusRulesMap:
      patient-triage-rules:
        groups:
          - name: patient-triage.triage
            interval: 60s
            rules:
              # ── Escalation Rate Anomaly ─────────────────────────────────
              - alert: EscalationRateAnomaly
                expr: |
                  sum(rate(triage_escalation_total[15m])) == 0
                  AND
                  hour() >= 6 AND hour() <= 22
                for: 20m
                labels:
                  severity: warning
                  domain: triage
                annotations:
                  summary: "Zero confidence-driven escalations in 20 minutes during active hours"
                  description: |
                    No AUTO_ESCALATE events detected in the last 20 minutes during hospital 
                    operating hours. This may indicate the confidence-scoring logic silently 
                    broke rather than patients genuinely not needing escalation.
                  runbook: "Check /triage/predict responses and confidence_score values in audit logs"

              # ── Override Rate Spike ─────────────────────────────────────
              - alert: OverrideRateSpike
                expr: |
                  sum(rate(triage_override_total[5m])) 
                  > 3 * avg_over_time(sum(rate(triage_override_total[5m]))[1h:5m])
                for: 5m
                labels:
                  severity: warning
                  domain: triage
                annotations:
                  summary: "Clinician override rate is 3× above the 1h moving average"
                  description: |
                    Override rate spike detected. Clinicians may be disagreeing with AI 
                    recommendations at an unusual rate. Check: model confidence distribution,
                    recent symptom pattern shifts, or UI changes affecting override button visibility.
                  runbook: "Query audit_logs WHERE action='OVERRIDE' in the last 30 minutes"

              # ── Audit Write Failure ─────────────────────────────────────
              - alert: AuditLogWriteFailure
                expr: increase(triage_audit_write_errors_total[5m]) > 0
                for: 1m
                labels:
                  severity: critical
                  domain: compliance
                annotations:
                  summary: "COMPLIANCE P1: Audit log write failure detected"
                  description: |
                    One or more audit log entries failed to write. Every triage recommendation 
                    and clinician decision MUST be durably logged for compliance. 
                    Unlogged decisions create a gap in the audit trail.
                  runbook: "Check DB connectivity, disk space on /data PVC, and uvicorn error logs"

              # ── Triage Intake Latency ───────────────────────────────────
              - alert: TriageIntakeLatencyHigh
                expr: |
                  histogram_quantile(0.95, 
                    sum(rate(triage_predict_duration_seconds_bucket[5m])) by (le)
                  ) > 2
                for: 5m
                labels:
                  severity: warning
                  domain: performance
                annotations:
                  summary: "POST /triage/predict p95 latency > 2s"
                  description: |
                    Triage intake latency is above the 2s threshold (p95 = {{ $value | humanizeDuration }}).
                    This endpoint is on the critical path during patient arrival. 
                    Common causes: LightGBM model load, SQLite contention, surge queue processing.
                  runbook: "Check backend pod CPU/memory, SQLite /data PVC IOPS, model load time"

              # ── Reassessment Latency ────────────────────────────────────
              - alert: ReassessmentLatencyHigh
                expr: |
                  histogram_quantile(0.95,
                    sum(rate(triage_revitals_duration_seconds_bucket[5m])) by (le)
                  ) > 3
                for: 5m
                labels:
                  severity: warning
                  domain: performance
                annotations:
                  summary: "POST /triage/revitals p95 latency > 3s"
                  description: |
                    Re-vitals reassessment latency is above the 3s threshold during what may be 
                    a surge event. This is on the critical path for identifying deteriorating patients.
                    Current p95: {{ $value | humanizeDuration }}.
                  runbook: "Check surge mode status, active queue depth, and backend pod resources"

          - name: patient-triage.infra
            rules:
              # ── Pod CrashLoop ───────────────────────────────────────────
              - alert: BackendPodCrashLoop
                expr: |
                  increase(kube_pod_container_status_restarts_total{
                    namespace="patient-triage", container="backend"
                  }[15m]) > 2
                for: 5m
                labels:
                  severity: critical
                  domain: infra
                annotations:
                  summary: "Backend pod is crash-looping"
                  description: "Pod {{ $labels.pod }} has restarted {{ $value }} times in 15 minutes."
                  runbook: "kubectl logs -n patient-triage {{ $labels.pod }} --previous"

              # ── Node Memory Pressure ────────────────────────────────────
              - alert: EKSNodeMemoryPressure
                expr: |
                  (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 0.85
                for: 10m
                labels:
                  severity: warning
                  domain: infra
                annotations:
                  summary: "EKS node memory utilization > 85%"
                  description: "Node {{ $labels.instance }} memory utilization: {{ $value | humanizePercentage }}"

grafana:
  enabled: true

  adminPassword: "changeme-use-sealed-secret"

  persistence:
    enabled: true
    storageClassName: gp2
    size: 5Gi

  # Load the triage-specific dashboard from a ConfigMap
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL

  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: patient-triage
          orgId: 1
          folder: "PatientTriage"
          type: file
          disableDeletion: true
          options:
            path: /var/lib/grafana/dashboards/patient-triage

alertmanager:
  enabled: true

  config:
    global:
      resolve_timeout: 5m
    route:
      group_by: ["alertname", "severity", "domain"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: "default"
      routes:
        - matchers:
            - severity = critical
          receiver: "pagerduty-critical"
          continue: true
    receivers:
      - name: "default"
        # Configure SNS/PagerDuty/Slack in production
      - name: "pagerduty-critical"
        # Add PagerDuty routing key for P1 alerts (audit failures, crash loops)

# Scrape the PatientTriage backend /metrics endpoint
additionalScrapeConfigs:
  - job_name: "patient-triage-backend"
    static_configs:
      - targets: ["backend.patient-triage.svc.cluster.local:8000"]
    metrics_path: "/metrics"
    scrape_interval: 15s
