apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: patient-triage
  labels:
    app.kubernetes.io/name: fluent-bit
    app.kubernetes.io/part-of: patient-triage
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush         5
        Daemon        Off
        Log_Level     info
        Parsers_File  parsers.conf
        HTTP_Server   On
        HTTP_Listen   0.0.0.0
        HTTP_Port     2020

    # Tail patient-triage container logs from the node
    [INPUT]
        Name              tail
        Tag               patient-triage.*
        Path              /var/log/containers/*patient-triage*.log
        multiline.parser  docker, cri
        DB                /var/log/flb_patient_triage.db
        Skip_Long_Lines   On
        Refresh_Interval  5
        Rotate_Wait       30
        Mem_Buf_Limit     5MB

    # Kubernetes metadata enrichment
    [FILTER]
        Name                kubernetes
        Match               patient-triage.*
        Kube_URL            https://kubernetes.default.svc:443
        Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
        Kube_Tag_Prefix     patient-triage.var.log.containers.
        Merge_Log           On
        Keep_Log            Off
        Annotations         Off
        Labels              On

    # Parse JSON audit log lines from the backend for structured forwarding
    [FILTER]
        Name   grep
        Match  patient-triage.*
        Regex  log .+

    # Output: CloudWatch Logs
    [OUTPUT]
        Name                cloudwatch_logs
        Match               patient-triage.*
        region              us-east-1
        log_group_name      /patient-triage/backend
        log_stream_prefix   k8s/
        auto_create_group   On
        log_key             log
        retry_limit         5

  parsers.conf: |
    [PARSER]
        Name        docker
        Format      json
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L
        Time_Keep   On
        Decode_Field_As escaped_utf8 log do_next
        Decode_Field_As json log

    [PARSER]
        Name        uvicorn
        Format      regex
        Regex       ^(?<time>[^\s]+)\s+(?<level>[A-Z]+)\s+(?<message>.+)$
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit
  namespace: patient-triage
  labels:
    app.kubernetes.io/name: fluent-bit
    app.kubernetes.io/part-of: patient-triage
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: fluent-bit

  template:
    metadata:
      labels:
        app.kubernetes.io/name: fluent-bit
        app.kubernetes.io/part-of: patient-triage
    spec:
      serviceAccountName: fluent-bit-sa
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          effect: NoSchedule

      containers:
        - name: fluent-bit
          image: public.ecr.aws/aws-observability/aws-for-fluent-bit:stable
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 2020
              protocol: TCP

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"

          env:
            - name: AWS_REGION
              value: "us-east-1"
            - name: CLUSTER_NAME
              value: "patient-triage"

          volumeMounts:
            - name: config
              mountPath: /fluent-bit/etc/
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: varlibdockercontainers
              mountPath: /var/lib/docker/containers
              readOnly: true

      volumes:
        - name: config
          configMap:
            name: fluent-bit-config
        - name: varlog
          hostPath:
            path: /var/log
        - name: varlibdockercontainers
          hostPath:
            path: /var/lib/docker/containers

---
# ServiceAccount for Fluent Bit (needs CloudWatch put permissions via IRSA)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluent-bit-sa
  namespace: patient-triage
  annotations:
    # Attach an IAM role with CloudWatch Logs PutLogEvents permission
    eks.amazonaws.com/role-arn: "arn:aws:iam::ACCOUNT_ID:role/patient-triage-fluent-bit-role"
---
# ClusterRole: allow Fluent Bit to read pod metadata for k8s filter
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fluent-bit-role
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces", "nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fluent-bit-role-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fluent-bit-role
subjects:
  - kind: ServiceAccount
    name: fluent-bit-sa
    namespace: patient-triage
