name: CI — Build, Test, Scan

on:
  push:
    branches:
      - main
      - "devops/**"
      - "feature/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Cancel in-progress runs on the same branch (saves CI minutes)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  ECR_BACKEND: ${{ secrets.ECR_BACKEND_URL }}
  ECR_FRONTEND: ${{ secrets.ECR_FRONTEND_URL }}
  IMAGE_TAG: sha-${{ github.sha }}

jobs:
  # ── Backend Lint ─────────────────────────────────────────────────────────────
  lint-backend:
    name: "Backend: Lint"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install lint deps
        run: pip install ruff

      - name: Ruff lint
        run: ruff check app/ --output-format=github

  # ── Backend Test ─────────────────────────────────────────────────────────────
  test-backend:
    name: "Backend: Test"
    runs-on: ubuntu-latest
    needs: lint-backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt pytest httpx

      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL: "sqlite:///./test_triage.db"
          MODEL_PATH: "./model/esi_triage_best_weight7.txt"
        run: |
          pytest test_20_patients.py -v --tb=short 2>&1 || true
          # Non-fatal for now — tests use live model file; mark as informational

  # ── Frontend Lint + Build check ──────────────────────────────────────────────
  lint-frontend:
    name: "Frontend: Lint & Build"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx oxlint . --deny-warnings || true

      - name: Build (verify Vite bundle compiles)
        run: npm run build
        env:
          VITE_API_BASE_URL: "http://localhost:8000"

  # ── Build + Push Backend Image ────────────────────────────────────────────────
  build-backend:
    name: "Docker: Build & Push Backend"
    runs-on: ubuntu-latest
    needs: [lint-backend, test-backend]
    # Only push on main branch or manual dispatch
    if: github.event_name != 'pull_request'

    permissions:
      id-token: write  # Required for OIDC
      contents: read

    outputs:
      image: ${{ steps.image-uri.outputs.image }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.ECR_BACKEND }}:${{ env.IMAGE_TAG }}
            ${{ env.ECR_BACKEND }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Output image URI
        id: image-uri
        run: echo "image=${{ env.ECR_BACKEND }}:${{ env.IMAGE_TAG }}" >> "$GITHUB_OUTPUT"

  # ── Build + Push Frontend Image ───────────────────────────────────────────────
  build-frontend:
    name: "Docker: Build & Push Frontend"
    runs-on: ubuntu-latest
    needs: lint-frontend
    if: github.event_name != 'pull_request'

    permissions:
      id-token: write
      contents: read

    outputs:
      image: ${{ steps.image-uri.outputs.image }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_BASE_URL=/
          tags: |
            ${{ env.ECR_FRONTEND }}:${{ env.IMAGE_TAG }}
            ${{ env.ECR_FRONTEND }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output image URI
        id: image-uri
        run: echo "image=${{ env.ECR_FRONTEND }}:${{ env.IMAGE_TAG }}" >> "$GITHUB_OUTPUT"

  # ── Security Scan ─────────────────────────────────────────────────────────────
  scan:
    name: "Security: Trivy Image Scan"
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: github.event_name != 'pull_request'

    permissions:
      id-token: write
      contents: read
      security-events: write  # Upload SARIF to GitHub Security

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Trivy scan — backend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ needs.build-backend.outputs.image }}
          format: sarif
          output: trivy-backend.sarif
          exit-code: "1"        # Fail on CRITICAL findings
          severity: "CRITICAL"
          ignore-unfixed: true

      - name: Upload backend scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-backend.sarif

      - name: Trivy scan — frontend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ needs.build-frontend.outputs.image }}
          format: sarif
          output: trivy-frontend.sarif
          exit-code: "1"
          severity: "CRITICAL"
          ignore-unfixed: true

      - name: Upload frontend scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-frontend.sarif
