name: CD — Update GitOps Manifests

on:
  workflow_run:
    workflows: ["CI — Build, Test, Scan"]
    types:
      - completed
    branches:
      - main

  # Allow manual trigger with specific SHA
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (e.g. sha-abc1234)"
        required: true
        type: string

concurrency:
  group: cd-deploy
  cancel-in-progress: false  # Never cancel a deploy in progress

jobs:
  update-manifests:
    name: "GitOps: Update Image Tags → ArgoCD"
    runs-on: ubuntu-latest
    # Only proceed if CI workflow succeeded
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')

    permissions:
      contents: write  # Push manifest update commit
      id-token: write  # OIDC for AWS (ECR URL lookup)

    env:
      ECR_BACKEND: ${{ secrets.ECR_BACKEND_URL }}
      ECR_FRONTEND: ${{ secrets.ECR_FRONTEND_URL }}
      AWS_REGION: us-east-1

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Resolve image tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=sha-${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: "5.3.0"

      - name: Update backend image tag
        working-directory: gitops
        run: |
          kustomize edit set image \
            "ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/patient-triage/backend=${{ env.ECR_BACKEND }}:${{ steps.tag.outputs.tag }}"

      - name: Update frontend image tag
        working-directory: gitops
        run: |
          kustomize edit set image \
            "ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/patient-triage/frontend=${{ env.ECR_FRONTEND }}:${{ steps.tag.outputs.tag }}"

      - name: Commit and push manifest update
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add gitops/kustomization.yaml

          if git diff --cached --quiet; then
            echo "No manifest changes — skipping commit"
            exit 0
          fi

          git commit -m "chore(cd): deploy ${{ steps.tag.outputs.tag }}

          Updated image tags:
          - backend:  ${{ env.ECR_BACKEND }}:${{ steps.tag.outputs.tag }}
          - frontend: ${{ env.ECR_FRONTEND }}:${{ steps.tag.outputs.tag }}

          Triggered by: ${{ github.event_name }}
          Source SHA: ${{ github.event.workflow_run.head_sha || inputs.image_tag }}
          "

          git push origin main

      # ArgoCD picks up the manifest change automatically (automated sync).
      # The step below posts a notification to help track the deployment.
      - name: Summarise deployment
        run: |
          echo "## Deployment Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| | |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Tag** | \`${{ steps.tag.outputs.tag }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Backend** | \`${{ env.ECR_BACKEND }}:${{ steps.tag.outputs.tag }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Frontend** | \`${{ env.ECR_FRONTEND }}:${{ steps.tag.outputs.tag }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **GitOps path** | \`gitops/kustomization.yaml\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "> ArgoCD will detect the manifest change and sync the cluster automatically." >> "$GITHUB_STEP_SUMMARY"
